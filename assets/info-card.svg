<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 256" width="490" height="256" role="img" aria-label="Profile summary card for Satyaprakash Rout">
  <defs>
    <style>
      .card-bg { fill: #0d1117; }
      .card-border { fill: none; stroke: #21262d; stroke-width: 1.5; }
      .titlebar { fill: #161b22; }
      .dot { opacity: 0.9; }
      .title-text {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12.5px; fill: #58a6ff;
      }
      .key {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px; font-weight: bold; fill: #7ee787;
      }
      .val {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 12px; fill: #c9d1d9;
      }
      .line {
        opacity: 0;
        transform: translateX(-6px);
        animation: fadein 0.4s ease-out forwards;
      }
      @keyframes fadein {
        to { opacity: 1; transform: translateX(0); }
      }
      .cursor {
        fill: #7ee787;
        animation: blink 1s steps(1) infinite;
        animation-delay: 0.99s;
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect class="card-bg" x="0" y="0" width="490" height="256" rx="10"/>
  <rect class="titlebar" x="0" y="0" width="490" height="34" rx="10"/>
  <rect x="0" y="24" width="490" height="10" fill="#161b22"/>
  <rect class="card-border" x="1" y="1" width="488" height="254" rx="10"/>

  <circle class="dot" cx="18" cy="17.0" r="4" fill="#ff5f56"/>
  <circle class="dot" cx="32" cy="17.0" r="4" fill="#ffbd2e"/>
  <circle class="dot" cx="46" cy="17.0" r="4" fill="#27c93f"/>
  <text class="title-text" x="470" y="21.0" text-anchor="end">neofetch --user SatyaPrakash252</text>

  
    <g class="line" style="animation-delay:0.15s">
      <text class="key" x="20" y="68">Now</text>
      <text class="val" x="112" y="68">B.Tech CSE student (2023-2027)</text>
    </g>
    <g class="line" style="animation-delay:0.27s">
      <text class="key" x="20" y="94">Role</text>
      <text class="val" x="112" y="94">Full Stack Developer / AI Builder</text>
    </g>
    <g class="line" style="animation-delay:0.39s">
      <text class="key" x="20" y="120">Stack</text>
      <text class="val" x="112" y="120">Java, Python, React, Next.js, FastAPI, Flask</text>
    </g>
    <g class="line" style="animation-delay:0.51s">
      <text class="key" x="20" y="146">AI/ML</text>
      <text class="val" x="112" y="146">TensorFlow, Scikit-learn, CNNs, Agentic AI</text>
    </g>
    <g class="line" style="animation-delay:0.63s">
      <text class="key" x="20" y="172">Highlight</text>
      <text class="val" x="112" y="172">Built Project CURA - an agentic clinical docs platform</text>
    </g>
    <g class="line" style="animation-delay:0.75s">
      <text class="key" x="20" y="198">Highlight</text>
      <text class="val" x="112" y="198">CNN-based plant disease detector (TensorFlow + OpenCV)</text>
    </g>
    <g class="line" style="animation-delay:0.87s">
      <text class="key" x="20" y="224">Goal</text>
