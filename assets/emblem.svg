<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="Profile emblem: SR">
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf9ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7fd8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="emblem-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ring { fill: none; stroke: #1c4a66; stroke-width: 1; }
      .ring-bright { fill: none; stroke: #7fd8ff; stroke-width: 1.4; }
      .spin-slow {
        transform-box: fill-box; transform-origin: center;
        animation: spin 14s linear infinite;
      }
      .spin-rev {
        transform-box: fill-box; transform-origin: center;
        animation: spin-rev 20s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-rev { to { transform: rotate(-360deg); } }
      .pulse {
        transform-box: fill-box; transform-origin: center;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50%      { opacity: 0.9;  transform: scale(1.04); }
      }
      .initials {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 46px; font-weight: bold; fill: #eaf9ff;
        text-anchor: middle; dominant-baseline: central;
      }
      .fadein { opacity: 0; animation: fadein 0.8s ease-out forwards; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <circle cx="140.0" cy="140.0" r="134.8" fill="#050b14"/>
  <circle class="pulse" cx="140.0" cy="140.0" r="128.8" fill="url(#core-glow)"/>

