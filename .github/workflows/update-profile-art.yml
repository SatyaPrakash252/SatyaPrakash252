name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Fetch latest contributions
        env:
          GITHUB_USERNAME: SatyaPrakash252
          CONTRIB_OUT: data/contributions.json
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        env:
          CONTRIB_OUT: data/contributions.json
          HEATMAP_OUT: assets/contrib-heatmap.svg
        run: python scripts/render_heatmap_svg.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg"
